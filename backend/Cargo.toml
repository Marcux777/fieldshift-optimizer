[package]
name = "fieldshift-api"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rust API for the FieldShift migration; serves frozen, verified evidence"

[dependencies]
anyhow = "1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
