[workspace]
resolver = "2"
members = [
  "crates/fieldshift-numeric",
  "crates/fieldshift-io",
  "crates/fieldshift-model",
  "crates/fieldshift-eval",
  "crates/fieldshift-cli",
  "crates/fieldshift-api",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
toml = "0.8"
csv = "1"
flate2 = "1"
clap = { version = "4", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
