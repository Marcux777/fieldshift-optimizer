[package]
name = "fieldshift-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
fieldshift-numeric = { path = "../fieldshift-numeric" }
fieldshift-io = { path = "../fieldshift-io" }
fieldshift-model = { path = "../fieldshift-model" }
fieldshift-eval = { path = "../fieldshift-eval" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
