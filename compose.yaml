# Ambiente de desenvolvimento e teste (reutilizável): docker compose up -d dev; docker compose exec dev <cmd>
# Este serviço é só para a implementação Python de referência (oráculo dos testes diferenciais).
# O app público roda outro contêiner: Rust + SvelteKit (backend/Dockerfile) no Render Free; ver docs/HOSTING.md.
name: fieldshift
x-shared-cache-uv: &shared-cache-uv ${DOCKER_SHARED_CACHE_ROOT:-${HOME}/.cache/docker-shared}/uv:/home/app/.cache/uv:z
services:
  dev:
    build: .
    image: fieldshift:dev
    container_name: fieldshift-dev
    command: sleep infinity
    working_dir: /app
    volumes:
      - .:/app:z
      - *shared-cache-uv
    environment:
      UV_PROJECT_ENVIRONMENT: /opt/venv
    ports:
      - "127.0.0.1:8501:8501"
