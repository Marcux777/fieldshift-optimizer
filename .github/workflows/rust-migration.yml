name: Rust migration (experimental)
on:
  push:
    branches: [feat/rust-svelte-migration]
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/rust-migration.yml'
      - 'reports/20261114T181122Z/**'
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path backend/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path backend/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path backend/Cargo.toml
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run build
